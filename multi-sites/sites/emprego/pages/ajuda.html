<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tutorial: Como buscar candidatos no Emprego Aqui</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card-bg: #ffffff;
    --text: #1a1d23;
    --text-muted: #5b6270;
    --accent: #e8720c;
    --accent-dark: #c65e08;
    --border: #e2e4e9;
    --shadow: rgba(20, 20, 30, 0.12);
    --dot-inactive: #d8dae0;
    --track-bg: #eceef2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161a;
      --card-bg: #1e2126;
      --text: #edeef0;
      --text-muted: #a3a9b4;
      --accent: #f08a2e;
      --accent-dark: #e8720c;
      --border: #2c2f36;
      --shadow: rgba(0, 0, 0, 0.4);
      --dot-inactive: #3a3d44;
      --track-bg: #262931;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161a;
    --card-bg: #1e2126;
    --text: #edeef0;
    --text-muted: #a3a9b4;
    --accent: #f08a2e;
    --accent-dark: #e8720c;
    --border: #2c2f36;
    --shadow: rgba(0, 0, 0, 0.4);
    --dot-inactive: #3a3d44;
    --track-bg: #262931;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
  }

  .page-header {
    text-align: center;
    max-width: 640px;
    margin-bottom: 20px;
  }

  .page-header h1 {
    font-size: clamp(1.2rem, 4vw, 1.6rem);
    margin: 0 0 6px;
    font-weight: 700;
  }

  .page-header p {
    margin: 0;
    color: var(--text-muted);
    font-size: 0.95rem;
  }

  .tutorial-card {
    width: 100%;
    max-width: 420px;
    background: var(--card-bg);
    border-radius: 20px;
    box-shadow: 0 8px 30px var(--shadow);
    border: 1px solid var(--border);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .progress-track {
    height: 6px;
    width: 100%;
    background: var(--track-bg);
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-dark));
    transition: width 0.35s ease;
    width: 12.5%;
  }

  .step-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 18px 0;
  }

  .step-label .step-title {
    font-weight: 700;
    font-size: 1.02rem;
  }

  .step-label .step-count {
    font-size: 0.85rem;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  .image-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 480 / 1000;
    max-height: 62vh;
    background: var(--track-bg);
    overflow: hidden;
    margin-top: 12px;
  }

  .image-wrap img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
    transition: opacity 0.25s ease;
    pointer-events: none;
  }

  .image-wrap img.active {
    opacity: 1;
    pointer-events: auto;
  }

  .cta-panel {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 28px 22px;
    box-sizing: border-box;
    background: linear-gradient(160deg, #1b1f3b 0%, #262b52 55%, #1b1f3b 100%);
    opacity: 0;
    transition: opacity 0.25s ease;
    pointer-events: none;
  }

  .cta-panel.active {
    opacity: 1;
    pointer-events: auto;
  }

  .cta-logo {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 18px;
  }

  .cta-logo-text {
    font-size: 1.15rem;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 0.2px;
  }

  .cta-logo-text b {
    color: #ffffff;
  }

  .cta-emoji {
    font-size: 2.6rem;
    margin-bottom: 6px;
  }

  .cta-heading {
    color: #ffffff;
    font-size: 1.4rem;
    font-weight: 800;
    margin: 4px 0 10px;
  }

  .cta-sub {
    color: #d7dae6;
    font-size: 0.95rem;
    line-height: 1.5;
    max-width: 300px;
    margin: 0 0 26px;
  }

  .cta-button {
    display: inline-block;
    background: linear-gradient(90deg, var(--accent), var(--accent-dark));
    color: #ffffff !important;
    text-decoration: none;
    font-weight: 700;
    font-size: 1rem;
    padding: 14px 28px;
    border-radius: 999px;
    box-shadow: 0 6px 18px rgba(240, 138, 46, 0.4);
    transition: transform 0.15s ease;
  }

  .cta-button:active {
    transform: scale(0.97);
  }

  .cta-url {
    display: block;
    margin-top: 16px;
    color: #9aa0b8;
    font-size: 0.78rem;
    word-break: break-all;
  }

  .nav-zone {
    position: absolute;
    top: 0;
    height: 100%;
    width: 32%;
    cursor: pointer;
    z-index: 2;
    background: transparent;
    border: none;
    padding: 0;
  }
  .nav-zone.left { left: 0; }
  .nav-zone.right { right: 0; }

  .caption {
    padding: 14px 18px 6px;
    font-size: 0.95rem;
    line-height: 1.45;
    color: var(--text);
    height: calc(2 * 1.45em + 20px);
    overflow: hidden;
    display: flex;
    align-items: flex-start;
  }

  .dots {
    display: flex;
    justify-content: center;
    gap: 7px;
    padding: 4px 18px 16px;
    flex-wrap: wrap;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--dot-inactive);
    border: none;
    padding: 0;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.2s ease;
  }

  .dot.active {
    background: var(--accent);
    transform: scale(1.3);
  }

  .controls {
    display: flex;
    gap: 10px;
    padding: 0 18px 20px;
  }

  .btn {
    flex: 1;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--track-bg);
    color: var(--text);
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: opacity 0.2s ease, transform 0.1s ease;
    user-select: none;
    font-family: inherit;
  }

  .btn:active {
    transform: scale(0.97);
  }

  .btn.primary {
    background: linear-gradient(90deg, var(--accent), var(--accent-dark));
    color: #fff;
    border: none;
  }

  .btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .hint {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.78rem;
    margin-top: 16px;
    max-width: 420px;
  }

  @media (max-width: 380px) {
    .step-label .step-title { font-size: 0.92rem; }
    .caption { font-size: 0.88rem; }
  }
</style>
</head>
<body>

  <div class="page-header">
    <h1>Como buscar candidatos no Emprego Aqui</h1>
    <p>Passo a passo: da busca até a conversa no WhatsApp</p>
  </div>

  <div class="tutorial-card" id="card">
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="step-label">
      <span class="step-title" id="stepTitle"></span>
      <span class="step-count" id="stepCount"></span>
    </div>

    <div class="image-wrap" id="imageWrap">
      <button class="nav-zone left" id="zoneLeft" aria-label="Passo anterior"></button>
      <button class="nav-zone right" id="zoneRight" aria-label="Próximo passo"></button>
    </div>

    <div class="caption" id="caption"></div>

    <div class="dots" id="dots"></div>

    <div class="controls">
      <button class="btn" id="prevBtn">&larr; Anterior</button>
      <button class="btn primary" id="nextBtn">Próximo &rarr;</button>
    </div>
  </div>

  <p class="hint">Toque nas laterais da imagem, use as setas do teclado, ou arraste para o lado.</p>

  let current = 0;
  const imageWrap = document.getElementById('imageWrap');
  const stepTitle = document.getElementById('stepTitle');
  const stepCount = document.getElementById('stepCount');
  const caption = document.getElementById('caption');
  const progressFill = document.getElementById('progressFill');
  const dotsContainer = document.getElementById('dots');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  // build panels: normal screenshot slides use <img>, the final slide is a CTA panel
  const panelEls = slides.map((s, i) => {
    let el;
    if (s.type === 'cta') {
      el = document.createElement('div');
      el.className = 'cta-panel';
      el.innerHTML = `
        <div class="cta-logo">
          <svg viewBox="0 0 24 24" width="34" height="34" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 22s7-7.58 7-12.5A7 7 0 0 0 5 9.5C5 14.42 12 22 12 22z" stroke="#ffffff" stroke-width="1.6" fill="#f08a2e"/>
            <circle cx="12" cy="9.5" r="2.6" fill="#ffffff"/>
          </svg>
          <span class="cta-logo-text"><b>Emprego</b>Aqui</span>
        </div>
        <div class="cta-emoji">🎉</div>
        <h2 class="cta-heading">Pronto pra testar?</h2>
        <p class="cta-sub">Agora é sua vez! Abra o site, busque um candidato de verdade e mande a mensagem.</p>
        <a class="cta-button" href="${s.cta_url}" target="_blank" rel="noopener">Abrir o site &rarr;</a>
        <span class="cta-url">${s.cta_url}</span>
      `;
    } else {
      el = document.createElement('img');
      el.src = 'data:image/jpeg;base64,' + s.b64;
      el.alt = s.title;
    }
    if (i === 0) el.classList.add('active');
    imageWrap.appendChild(el);
    return el;
  });

  // build dots
  const dotEls = slides.map((_, i) => {
    const d = document.createElement('button');
    d.className = 'dot';
    d.setAttribute('aria-label', 'Ir para passo ' + (i + 1));
    d.addEventListener('click', () => goTo(i));
    dotsContainer.appendChild(d);
    return d;
  });

  function render() {
    panelEls.forEach((el, i) => el.classList.toggle('active', i === current));
    dotEls.forEach((d, i) => d.classList.toggle('active', i === current));
    stepTitle.textContent = slides[current].title;
    stepCount.textContent = (current + 1) + ' / ' + slides.length;
    caption.textContent = slides[current].caption;
    progressFill.style.width = ((current + 1) / slides.length * 100) + '%';
    prevBtn.disabled = current === 0;
    const isLast = current === slides.length - 1;
    nextBtn.style.display = isLast ? 'none' : 'flex';
    prevBtn.style.flex = isLast ? '1' : '';
  }

  function goTo(i) {
    if (i < 0 || i >= slides.length) return;
    current = i;
    render();
  }

  prevBtn.addEventListener('click', () => goTo(current - 1));
  nextBtn.addEventListener('click', () => goTo(current + 1));

  document.getElementById('zoneLeft').addEventListener('click', () => goTo(current - 1));
  document.getElementById('zoneRight').addEventListener('click', () => goTo(current + 1));

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') goTo(current - 1);
    if (e.key === 'ArrowRight') goTo(current + 1);
  });

  // swipe support
  let touchStartX = null;
  imageWrap.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
  }, { passive: true });
  imageWrap.addEventListener('touchend', (e) => {
    if (touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 40) {
      if (dx < 0) goTo(current + 1);
      else goTo(current - 1);
    }
    touchStartX = null;
  });

  render();
</script>
