<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roda de recursos: onde a tecnologia reduz custo</title>
<style>
:root{--bg:#f3f1ec;--ink:#1d2530;--mute:#5b6572;--panel:#ffffff;--line:#d9d5cb;--hub:#1d2530;--hubink:#f3f1ec;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171d;--ink:#e8e6e1;--mute:#9aa3ad;--panel:#1b222b;--line:#2c3541;--hub:#e8e6e1;--hubink:#12171d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12171d;--ink:#e8e6e1;--mute:#9aa3ad;--panel:#1b222b;--line:#2c3541;--hub:#e8e6e1;--hubink:#12171d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5}
main{max-width:1100px;margin:0 auto;padding:28px 18px 48px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.5rem,3.4vw,2.2rem);margin:0 0 6px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 22px;max-width:62ch}
.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.wheel{width:100%;max-width:560px;margin:0 auto;display:block}
.slice{cursor:pointer;outline:none}
.slice path{stroke:var(--bg);stroke-width:3;transition:transform .18s ease,filter .18s ease;transform-origin:300px 300px}
.slice:hover path,.slice:focus-visible path{filter:brightness(1.12)}
.slice.on path{transform:scale(1.045)}
.slice:focus-visible path{stroke:var(--ink);stroke-width:4}
.slice text{fill:#fff;font-size:15px;font-weight:600;text-anchor:middle;pointer-events:none}
.slice .ic{stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.hub{fill:var(--hub)}
.hubt{fill:var(--hubink);font-family:Georgia,serif;font-size:19px;text-anchor:middle;font-weight:700}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
.badge{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;margin-bottom:12px}
.badge svg{width:56px;height:56px;stroke:#fff;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.panel h2{font-family:Georgia,serif;font-size:1.5rem;margin:0 0 6px}
.cen{margin:0 0 16px;padding:12px 14px;border-left:4px solid var(--c);background:var(--bg);border-radius:0 8px 8px 0;font-size:.95rem}
.panel h3{font-size:.95rem;margin:0 0 8px;color:var(--mute);font-weight:600}
.panel ul{margin:0;padding-left:20px}
.panel li{margin:0 0 9px}
.hint{color:var(--mute);font-size:.88rem;margin-top:14px}
details{border-top:1px solid var(--line)}
summary{cursor:pointer;font-weight:600;padding:10px 0;list-style:none;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--c);font-size:1.2rem;line-height:1}
details[open] summary::after{content:"\2013"}
details p{margin:0 0 8px;font-size:.93rem}
.qq{color:var(--mute);font-style:italic}
@media (prefers-reduced-motion:reduce){.slice path{transition:none}}
</style>
</head>
<body>
<main>
<h1>Roda de recursos: onde a tecnologia reduz custo</h1>
<p class="sub">Escolha uma fatia. Cada recurso se desdobra em verbos: o que a tecnologia faz hoje e a pergunta que ajuda o dono a imaginar o problema na própria empresa.</p>
<div class="grid">
<svg id="wheel" class="wheel" viewBox="0 0 600 600" role="group" aria-label="Roda com nove recursos tecnológicos"></svg>
<section class="panel" id="panel" aria-live="polite"></section>
</div>
</main>
<script>
var ICONS={
ia:'<circle cx="5" cy="6" r="2"/><circle cx="5" cy="18" r="2"/><circle cx="12" cy="12" r="2.4"/><circle cx="19" cy="6" r="2"/><circle cx="19" cy="18" r="2"/><path d="M7 6.8l3 3.6M7 17.2l3-3.6M14.2 10.8l3-3.6M14.2 13.2l3 3.6"/>',
cel:'<rect x="7" y="2" width="10" height="20" rx="2.2"/><path d="M10.5 19h3M10 5h4"/>',
pai:'<rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4M7 13v-3M11 13V8M15 13v-5M18 13v-2"/>',
int:'<rect x="3" y="3" width="18" height="7" rx="1.5"/><rect x="3" y="14" width="18" height="7" rx="1.5"/><circle cx="7" cy="6.5" r=".8"/><circle cx="7" cy="17.5" r=".8"/><path d="M12 10v4M10 12h4"/>',
cam:'<rect x="3" y="7" width="18" height="12" rx="2"/><circle cx="12" cy="13" r="3.2"/><path d="M8 7l1.5-3h5L16 7"/>',
geo:'<path d="M12 21s-7-6.2-7-11a7 7 0 0114 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
msg:'<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/>',
voz:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/>',
doc:'<path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12h7M9 15h7M9 18h4"/>'};
var T=[
{k:'ia',n:'IA',h:215,c:'Uma pessoa lê e-mails de fornecedores e digita os pedidos no sistema. A IA lê, preenche e só pede ajuda quando tem dúvida.',q:['Tem documentos, e-mails ou contratos que alguém lê e depois digita no sistema?','Tem perguntas de clientes que se repetem o dia todo?','Alguma decisão depende sempre da experiência de uma pessoa, como orçar, classificar ou aprovar?','Tem informação espalhada em pastas e planilhas que as pessoas perdem tempo procurando?']},
{k:'cel',n:'Celular',h:160,c:'O técnico termina o serviço, tira fotos, coleta a assinatura e registra tudo no celular. O escritório recebe pronto, sem digitar.',q:['Tem equipe fora da empresa que depois passa as informações para o escritório?','Alguém anota em papel ou manda mensagem solta e depois outra pessoa digita?','Alguma aprovação ou ordem depende de ligação e poderia chegar como notificação com confirmação?','Clientes ou fornecedores poderiam fazer pedidos e consultas sozinhos por um app ou link?']},
{k:'pai',n:'Painéis',h:35,c:'O dono abre uma tela de manhã e vê vendas, estoque, atrasos e contas a receber, sem pedir relatório a ninguém.',q:['Que informações você gostaria de ver todo dia em uma tela só?','Algum relatório depende de juntar dados de várias planilhas ou sistemas?','Que alerta você gostaria de receber sozinho: vencimento, estoque baixo, atraso, meta fora do previsto?']},
{k:'int',n:'Integração',h:265,c:'O pedido entra no WhatsApp, vira venda no sistema, gera a nota e atualiza o estoque. Ninguém copia dado de um lugar para o outro.',q:['Quais sistemas ou planilhas não conversam entre si e obrigam alguém a copiar dados?','Tem tarefa que alguém precisa lembrar de fazer todo dia, semana ou mês?','Algum processo para quando uma pessoa específica falta?']},
{k:'cam',n:'Câmera',h:340,c:'Uma câmera na linha de produção confere se o produto saiu certo, conta as peças e avisa quando algo foge do padrão.',q:['Alguma conferência é feita a olho, como contar, checar qualidade ou verificar uma regra?','Tem custo ligado a perda, desperdício, furto ou acesso indevido?','Alguma ocorrência exige registro com foto, como avaria, entrega ou vistoria?','O controle de entrada e saída de pessoas ou veículos é feito na mão?']},
{k:'geo',n:'Localização',h:12,c:'O gestor vê todos os veículos no mapa, o sistema monta a melhor rota e confirma que cada visita aconteceu no endereço certo.',q:['Você acompanha veículos, equipes ou entregas por ligação e mensagem?','Alguém monta roteiros de visita ou entrega pela experiência?','O registro de presença ou serviço em campo depende só da palavra do funcionário?','Algum custo ou comissão poderia ser calculado pela distância ou pelo tempo no local?']},
{k:'msg',n:'Mensagens',h:140,c:'O cliente confirma consulta, recebe lembrete de pagamento e pede orçamento pelo WhatsApp. O sistema responde e registra tudo.',q:['Quanto tempo sua equipe gasta respondendo, confirmando ou cobrando por WhatsApp e e-mail?','Pedidos, orçamentos ou agendamentos chegam por mensagem e alguém passa para o sistema?','Clientes esquecem pagamento, consulta ou renovação?']},
{k:'voz',n:'Voz',h:300,c:'O atendimento ou a reunião é gravado, e o sistema transcreve, resume e registra as ações combinadas.',q:['Alguma reunião, ligação ou atendimento precisa ser resumido ou registrado depois?','Seus funcionários preferem mandar áudio a digitar?','Algum relatório de campo poderia ser ditado em vez de escrito?']},
{k:'doc',n:'Documentos',h:190,c:'Nota fiscal, boleto ou ficha é fotografado e o sistema lê, valida e lança sozinho. Estoque e ativos são controlados por QR code.',q:['Alguém digita notas, boletos, comprovantes, fichas ou formulários?','Estoque, equipamentos ou ativos poderiam ser controlados por QR code ou código de barras?','Tem papel que ainda precisa ser arquivado ou procurado manualmente?']}
];
var NS='http://www.w3.org/2000/svg',svg=document.getElementById('wheel'),panel=document.getElementById('panel');
var cx=300,cy=300,R=280,r=88,n=T.length,step=2*Math.PI/n,start=-Math.PI/2-step/2;
function pt(rad,a){return[cx+rad*Math.cos(a),cy+rad*Math.sin(a)]}
function col(h){return'hsl('+h+' 52% 38%)'}
var els=[];
T.forEach(function(t,i){
 var a0=start+i*step,a1=a0+step,am=(a0+a1)/2;
 var p1=pt(R,a0),p2=pt(R,a1),p3=pt(r,a1),p4=pt(r,a0);
 var g=document.createElementNS(NS,'g');g.setAttribute('class','slice');g.setAttribute('tabindex','0');g.setAttribute('role','button');g.setAttribute('aria-label',t.n);
 var d='M'+p1+'A'+R+','+R+' 0 0 1 '+p2+'L'+p3+'A'+r+','+r+' 0 0 0 '+p4+'Z';
 var path=document.createElementNS(NS,'path');path.setAttribute('d',d);path.setAttribute('fill',col(t.h));g.appendChild(path);
 var ip=pt(178,am),ic=document.createElementNS(NS,'g');ic.setAttribute('class','ic');
 ic.setAttribute('transform','translate('+(ip[0]-24)+','+(ip[1]-30)+') scale(2)');ic.innerHTML=ICONS[t.k];g.appendChild(ic);
 var tp=pt(232,am),tx=document.createElementNS(NS,'text');tx.setAttribute('x',tp[0]);tx.setAttribute('y',tp[1]+5);tx.textContent=t.n;g.appendChild(tx);
 g.addEventListener('click',function(){sel(i)});
 g.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();sel(i)}});
 svg.appendChild(g);els.push(g);
});
var hub=document.createElementNS(NS,'circle');hub.setAttribute('cx',cx);hub.setAttribute('cy',cy);hub.setAttribute('r',r-8);hub.setAttribute('class','hub');svg.appendChild(hub);
['Onde a','tecnologia','reduz custo?'].forEach(function(s,i){var x=document.createElementNS(NS,'text');x.setAttribute('x',cx);x.setAttribute('y',cy-14+i*22);x.setAttribute('class','hubt');x.setAttribute('style','font-size:'+(i==2?'15':'15')+'px');x.textContent=s;svg.appendChild(x)});
var V={
ia:[["Entender","Lê e interpreta texto livre: e-mails, contratos, laudos, mensagens.","Alguém lê textos longos para depois tomar uma decisão ou preencher algo?"],["Responder","Responde dúvidas de clientes e da equipe com base nos dados da empresa.","Que perguntas se repetem o dia todo e têm resposta conhecida?"],["Classificar","Separa, etiqueta e prioriza itens: chamados, pedidos, documentos, clientes.","Alguém triaja ou direciona coisas que chegam todo dia?"],["Prever","Antecipa demanda, atraso, falha, cancelamento e inadimplência.","O que você só descobre depois que o problema já aconteceu?"],["Gerar","Escreve textos, respostas, relatórios, propostas e resumos.","Quem escreve a mesma coisa várias vezes, mudando só alguns dados?"],["Recomendar","Sugere preço, produto, rota, próxima ação ou melhor decisão.","Que decisão depende sempre da experiência de uma pessoa específica?"]],
cel:[["Coletar","Registra dados no local, com formulário, foto, assinatura e localização.","Alguém anota em papel ou mensagem solta e depois outra pessoa digita?"],["Notificar","Avisa a pessoa certa na hora certa, com confirmação de leitura.","Algo importante depende de ligação ou de alguém lembrar de avisar?"],["Aprovar","Libera pedidos, descontos e pagamentos direto do celular.","Alguma aprovação trava até o responsável chegar ao escritório?"],["Registrar em campo","Equipe externa lança serviço, visita ou entrega sem voltar à empresa.","Sua equipe de rua só atualiza o sistema no fim do dia?"],["Acessar de qualquer lugar","Consulta e opera o sistema da empresa de onde estiver.","O que você precisa consultar ou resolver e hoje só dá no escritório?"]],
pai:[["Consolidar","Junta dados de vários sistemas e planilhas em uma tela só.","Alguém monta relatório copiando de vários lugares?"],["Comparar","Mostra meta contra realizado, mês contra mês, unidade contra unidade.","Que comparação você gostaria de ver e hoje não consegue?"],["Alertar","Avisa sozinho quando algo foge do esperado: atraso, estoque, vencimento.","O que você só percebe quando já é tarde?"],["Projetar","Estima o caixa, as vendas e a necessidade de compra para os próximos meses.","Que decisão você toma sem enxergar o que vem pela frente?"]],
int:[["Conectar","Liga sistemas que não conversam entre si, por API ou importação.","Quais sistemas obrigam alguém a copiar dado de um para outro?"],["Sincronizar","Mantém estoque, clientes e preços iguais em todos os lugares.","Já aconteceu de dois sistemas mostrarem números diferentes?"],["Agendar","Roda tarefas sozinho, de madrugada ou em horários fixos.","Que tarefa alguém precisa lembrar de fazer todo dia, semana ou mês?"],["Disparar ações","Um evento aciona o próximo passo: venda gera nota, atraso gera cobrança.","O que acontece em cadeia depois de uma venda ou de um pedido?"]],
cam:[["Ler","Extrai texto, manuscrito, códigos de barras, QR, documentos e mostradores.","Alguém digita o que está num papel, etiqueta, código ou display?"],["Identificar","Reconhece objetos, produtos, pessoas e placas em uma imagem.","Alguém precisa olhar e dizer o que é ou quem é?"],["Medir e contar","Estima dimensão, volume, peso, temperatura e quantidade.","Alguém conta, mede ou estima algo na mão ou a olho?"],["Conferir","Aponta defeitos, confere conformidade e compara com o padrão.","Alguma conferência ou inspeção é feita a olho?"],["Acompanhar","Detecta movimento, fluxo, eventos e analisa vídeo em tempo real.","Alguém precisa ficar de olho em um lugar ou processo o tempo todo?"],["Registrar","Guarda foto com GPS e hora, gera laudo e prova do que foi feito.","Já perdeu dinheiro por não ter prova de como algo estava ou foi entregue?"],["Interpretar","Descreve a cena, responde perguntas sobre a imagem, resume e busca no vídeo.","Alguém assiste a vídeo ou analisa foto para depois escrever o que viu?"]],
geo:[["Rastrear","Mostra onde estão veículos, equipes e entregas em tempo real.","Você pergunta por ligação onde cada um está?"],["Roteirizar","Monta a melhor rota e reduz combustível e tempo.","Alguém decide as rotas pela experiência?"],["Delimitar áreas","Avisa quando alguém entra ou sai de um local ou região.","Existe lugar onde veículo ou equipe não deveria estar, ou deveria ter estado?"],["Comprovar presença","Confirma que a visita ou o serviço ocorreu no endereço certo.","O registro de serviço depende só da palavra do funcionário?"],["Calcular distância","Calcula frete, comissão e reembolso pela distância e pelo tempo.","Algum valor é calculado manualmente a partir de quilometragem?"]],
msg:[["Atender","Responde clientes pelo WhatsApp e passa para humano só o que precisa.","Quanto tempo sua equipe gasta respondendo as mesmas perguntas?"],["Lembrar","Envia lembretes de consulta, vencimento, renovação e entrega.","Clientes esquecem pagamento, consulta ou prazo?"],["Cobrar","Faz a cobrança automática e acompanha quem pagou.","Alguém cobra manualmente e perde o ritmo?"],["Confirmar","Pede e registra confirmação de presença, pedido ou entrega.","Há faltas ou cancelamentos de última hora que custam caro?"],["Captar pedidos","Recebe pedido e orçamento por mensagem e já lança no sistema.","Pedidos chegam por mensagem e alguém precisa passar para o sistema?"]],
voz:[["Transcrever","Transforma áudio e chamadas em texto pesquisável.","Alguém precisa ouvir áudio ou reunião para registrar o que foi dito?"],["Resumir","Entrega pontos principais, decisões e tarefas combinadas.","Quem escreve ata, resumo ou relatório depois de reunião ou atendimento?"],["Comandar","Opera o sistema por comando de voz, com as mãos livres.","Há trabalho em que a pessoa está com as mãos ocupadas e precisa registrar algo?"],["Registrar por áudio","O funcionário fala e o sistema organiza o registro no formato certo.","Seus funcionários preferem mandar áudio a digitar?"]],
doc:[["Extrair","Lê campos de nota, boleto, ficha, contrato e formulário.","Alguém digita dados de documentos todos os dias?"],["Validar","Confere dados, valores e assinaturas e aponta divergências.","Alguém confere documento contra documento?"],["Classificar","Identifica o tipo e envia cada documento ao lugar certo.","Documentos chegam misturados e alguém separa?"],["Gerar","Cria propostas, contratos, laudos e relatórios a partir dos dados.","Alguém monta o mesmo documento repetidamente, mudando poucos dados?"],["Arquivar","Organiza, indexa e permite achar qualquer documento em segundos.","Alguém perde tempo procurando papel ou arquivo antigo?"]]};
function sel(i){
 var t=T[i];els.forEach(function(e,j){e.classList.toggle('on',i===j)});
 var c=col(t.h);panel.style.setProperty('--c',c);
 panel.innerHTML='<div class="badge" style="background:'+c+'"><svg viewBox="0 0 24 24">'+ICONS[t.k]+'</svg></div>'+
 '<h2>'+t.n+'</h2><p class="cen"><strong>Cenário:</strong> '+t.c+'</p><h3>O que dá para fazer ('+V[t.k].length+'). Toque em cada verbo.</h3>'+
 V[t.k].map(function(v){return'<details><summary>'+v[0]+'</summary><p>'+v[1]+'</p><p class="qq">Pergunte: “'+v[2]+'”</p></details>'}).join('')+
 '<p class="hint">Depois que ele apontar algo: quanto isso custa por mês? Quantas horas, de quem e com que frequência?</p>';
}
sel(0);
</script>
</body>
</html>
